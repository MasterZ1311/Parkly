<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="60%" stop-color="#0A1425"/>
      <stop offset="100%" stop-color="#111D33"/>
    </linearGradient>
    <clipPath id="logoClip">
      <rect width="96" height="96" rx="20"/>
    </clipPath>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative Grid Overlay -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  <!-- Logo Badge -->
  <g transform="translate(100, 130)">
    <rect width="104" height="104" rx="24" fill="#FFFFFF" filter="drop-shadow(0 4px 20px rgba(0,0,0,0.5))"/>
    <g transform="translate(4, 4)" clip-path="url(#logoClip)">
      <image href="data:image/png;base64," width="96" height="96" preserveAspectRatio="xMidYMid meet" />
    </g>
  </g>
  <!-- Text Content -->
  <text x="230" y="195" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">Parkly Admin Portal</text>
  <text x="100" y="305" fill="#EF010C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" letter-spacing="1.5">CITY MOBILITY COMMAND CENTER • CHENNAI</text>
  <text x="100" y="375" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="700">Centralized Telematics, Dispute Mediation &amp; Audits</text>
  <text x="100" y="435" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24">Real-time space verification, autonomous agent supervision &amp; platform governance</text>
  <!-- Badge -->
  <rect x="100" y="500" width="310" height="50" rx="25" fill="#EF010C" fill-opacity="0.15" stroke="#EF010C" stroke-width="2"/>
  <circle cx="126" cy="525" r="8" fill="#EF010C"/>
  <text x="146" y="533" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">COMMAND CENTER ACTIVE</text>
</svg>