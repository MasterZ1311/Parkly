<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parkly Admin Portal — City Operations &amp; Telemetry</title>
    <meta
      name="description"
      content="Parkly Administration Console for Chennai parking network oversight, space verifications, AI dispute arbitration, and GCC mobility analytics."
    />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Theme & Mobile WebApp -->
    <meta name="theme-color" content="#0B1628" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Parkly Admin" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Parkly Admin Portal — City Operations Command" />
    <meta property="og:description" content="Enterprise command console for smart parking verification, dispute resolution, and Chennai corridor telemetry." />
    <meta property="og:image" content="/og-image.svg" />

    <!-- Preload Self-Hosted Fonts (CSP 'self' compliant) -->
    <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Security & Privacy -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
