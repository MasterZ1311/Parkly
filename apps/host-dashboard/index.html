<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parkly Host Portal — Smart Parking &amp; Dynamic Pricing</title>
    <meta
      name="description"
      content="Manage your Chennai parking spaces, monitor live bay occupancy, run AI autonomous KYC verification, and track monthly INR revenue payouts with Parkly."
    />
    <meta name="keywords" content="parkly, host portal, parking management, dynamic pricing, Chennai, EV charging, smart parking" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Theme & Mobile WebApp -->
    <meta name="theme-color" content="#0B1628" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Parkly Host" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Parkly Host Portal — Smart City Parking Operations" />
    <meta property="og:description" content="Manage parking inventory, bay occupancy, dynamic surge tariffs, and INR payouts across Chennai." />
    <meta property="og:image" content="/og-image.svg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Parkly Host Portal" />
    <meta name="twitter:description" content="Chennai off-street parking operations desk with dynamic pricing and AI verification." />
    <meta name="twitter:image" content="/og-image.svg" />

    <!-- Preload Self-Hosted Fonts (CSP 'self' compliant) -->
    <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Security & Privacy -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
