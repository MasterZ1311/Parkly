# ============================================================
# Parkly — Docker Compose (Local Development)
# ============================================================
# Usage:
#   docker compose up -d            # Start all services
#   docker compose up postgres      # Start only PostgreSQL
#   docker compose logs -f          # Follow all logs
#
# Note: Run migrations intentionally (`npm run migrate:deploy`)
# after verifying any existing `parkly_postgres_data` backup.
# ============================================================

x-common-env: &common-env
  env_file:
    - path: .env
      required: false

x-dev-runtime-env: &dev-runtime-env
  NODE_ENV: ${NODE_ENV:-development}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-dev-only-jwt-access-secret-32chars}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-dev-only-jwt-refresh-secret-32chars}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
  SMS_PROVIDER: ${SMS_PROVIDER:-mock}
  PUSH_PROVIDER: ${PUSH_PROVIDER:-mock}

services:
  # ── Infrastructure ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: parkly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: parkly
      POSTGRES_PASSWORD: password
      POSTGRES_DB: parkly
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkly -d parkly"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - parkly-net

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: parkly-dynamodb
    restart: unless-stopped
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - parkly-net

  # DynamoDB table setup (waits for dynamodb-local on parkly-net and creates tables idempotently)
  dynamodb-setup:
    image: amazon/aws-cli:latest
    container_name: parkly-dynamodb-setup
    depends_on:
      dynamodb-local:
        condition: service_started
    environment:
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        i=0
        until aws dynamodb list-tables --endpoint-url http://dynamodb-local:8000 >/dev/null 2>&1; do
          i=$$((i + 1))
          if [ "$$i" -ge 30 ]; then
            echo "Timed out waiting for dynamodb-local:8000"
            exit 1
          fi
          sleep 1
        done

        aws dynamodb describe-table --table-name parkly-otp --endpoint-url http://dynamodb-local:8000 >/dev/null 2>&1 || \
        aws dynamodb create-table --table-name parkly-otp \
          --attribute-definitions AttributeName=phone,AttributeType=S \
          --key-schema AttributeName=phone,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST \
          --endpoint-url http://dynamodb-local:8000

        aws dynamodb update-time-to-live --table-name parkly-otp \
          --time-to-live-specification "Enabled=true,AttributeName=expiresAt" \
          --endpoint-url http://dynamodb-local:8000 >/dev/null 2>&1 || true

        aws dynamodb describe-table --table-name parkly-occupancy --endpoint-url http://dynamodb-local:8000 >/dev/null 2>&1 || \
        aws dynamodb create-table --table-name parkly-occupancy \
          --attribute-definitions AttributeName=spaceId,AttributeType=S AttributeName=timestamp,AttributeType=S \
          --key-schema AttributeName=spaceId,KeyType=HASH AttributeName=timestamp,KeyType=RANGE \
          --billing-mode PAY_PER_REQUEST \
          --endpoint-url http://dynamodb-local:8000

        aws dynamodb describe-table --table-name parkly-notifications --endpoint-url http://dynamodb-local:8000 >/dev/null 2>&1 || \
        aws dynamodb create-table --table-name parkly-notifications \
          --attribute-definitions AttributeName=pk,AttributeType=S AttributeName=sk,AttributeType=S \
          --key-schema AttributeName=pk,KeyType=HASH AttributeName=sk,KeyType=RANGE \
          --billing-mode PAY_PER_REQUEST \
          --endpoint-url http://dynamodb-local:8000

        echo "DynamoDB tables ready"
    networks:
      - parkly-net

  # ── Microservices ──────────────────────────────────────────
  api-gateway:
    <<: *common-env
    build:
      context: .
      dockerfile: ./services/api-gateway/Dockerfile
    container_name: parkly-api-gateway
    restart: unless-stopped
    environment:
      <<: *dev-runtime-env
      GATEWAY_PORT: 4000
      AUTH_URL: http://auth-service:4001
      BOOKING_URL: http://booking-service:4002
      PAYMENT_URL: http://payment-service:4003
      SEARCH_URL: http://search-service:4004
      PREDICTION_URL: http://prediction-service:4005
      OCCUPANCY_URL: http://occupancy-service:4007
      PRICING_URL: http://pricing-service:4008
      NOTIFICATION_URL: http://notification-service:4009
      HOST_URL: http://host-service:4010
      ADMIN_URL: http://admin-service:4011
    ports:
      - "4000:4000"
    depends_on:
      auth-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
      payment-service:
        condition: service_started
      search-service:
        condition: service_started
      prediction-service:
        condition: service_started
      occupancy-service:
        condition: service_started
      pricing-service:
        condition: service_started
      notification-service:
        condition: service_started
      host-service:
        condition: service_started
      admin-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/ready"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - parkly-net

  auth-service:
    <<: *common-env
    build:
      context: .
      dockerfile: ./services/auth-service/Dockerfile
    container_name: parkly-auth
    restart: unless-stopped
    environment:
      <<: *dev-runtime-env
      AUTH_PORT: 4001
      DATABASE_URL: postgresql://parkly:password@postgres:5432/parkly
      DYNAMO_ENDPOINT: http://dynamodb-local:8000
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
      dynamodb-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4001/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - parkly-net

  booking-service:
    <<: *common-env
    build:
      context: .
      dockerfile: ./services/booking-service/Dockerfile
    container_name: parkly-booking
    restart: unless-stopped
    environment:
      <<: *dev-runtime-env
      BOOKING_PORT: 4002
      DATABASE_URL: postgresql://parkly:password@postgres:5432/parkly
    ports:
      - "4002:4002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4002/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - parkly-net

  payment-service:
    <<: *common-env
    build:
      context: .
      dockerfile: ./services/payment-service/Dockerfile
    container_name: parkly-payment
    restart: unless-stopped
    environment:
      <<: *dev-runtime-env
      PAYMENT_PORT: 4003
      DATABASE_URL: postgresql://parkly:password@postgres:5432/parkly
    ports:
      - "4003:4003"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4003/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - parkly-net

  search-service:
    <<: *common-env
    build:
      context: .
      dockerfile: ./services/search-service/Dockerfile
    container_name: parkly-search
    restart: unless-stopped
    environment:
      <<: *dev-runtime-env
      SEARCH_PORT: 4004
      DATABASE_URL: postgresql://parkly:password@postgres:5432/parkly
      PREDICTION_URL: http://prediction-service:4005
    ports:
      - "4004:4004"
    depends_on:
      postgres:
        condition: service_healthy
      prediction-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4004/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - parkly-net

  prediction-service:
    <<: *common-env
    build:
      context: .
      dockerfile: ./services/prediction-service/Dockerfile
    container_name: parkly-prediction
    restart: unless-stopped
    environment:
      <<: *dev-runtime-env
      PREDICTION_PORT: 4005
    ports:
      - "4005:4005"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4005/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - parkly-net

  occupancy-service:
    <<: *common-env
    build:
      context: .
      dockerfile: ./services/occupancy-service/Dockerfile
    container_name: parkly-occupancy
    restart: unless-stopped
    environment:
      <<: *dev-runtime-env
      OCCUPANCY_PORT: 4007
      DYNAMO_ENDPOINT: http://dynamodb-local:8000
    ports:
      - "4007:4007"
    depends_on:
      dynamodb-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4007/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - parkly-net

  pricing-service:
    <<: *common-env
    build:
      context: .
      dockerfile: ./services/pricing-service/Dockerfile
    container_name: parkly-pricing
    restart: unless-stopped
    environment:
      <<: *dev-runtime-env
      PRICING_PORT: 4008
      DATABASE_URL: postgresql://parkly:password@postgres:5432/parkly
    ports:
      - "4008:4008"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4008/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - parkly-net

  notification-service:
    <<: *common-env
    build:
      context: .
      dockerfile: ./services/notification-service/Dockerfile
    container_name: parkly-notification
    restart: unless-stopped
    environment:
      <<: *dev-runtime-env
      NOTIFICATION_PORT: 4009
      DYNAMO_ENDPOINT: http://dynamodb-local:8000
    ports:
      - "4009:4009"
    depends_on:
      dynamodb-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4009/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - parkly-net

  host-service:
    <<: *common-env
    build:
      context: .
      dockerfile: ./services/host-service/Dockerfile
    container_name: parkly-host
    restart: unless-stopped
    environment:
      <<: *dev-runtime-env
      HOST_PORT: 4010
      DATABASE_URL: postgresql://parkly:password@postgres:5432/parkly
    ports:
      - "4010:4010"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4010/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - parkly-net

  admin-service:
    <<: *common-env
    build:
      context: .
      dockerfile: ./services/admin-service/Dockerfile
    container_name: parkly-admin-svc
    restart: unless-stopped
    environment:
      <<: *dev-runtime-env
      ADMIN_PORT: 4011
      DATABASE_URL: postgresql://parkly:password@postgres:5432/parkly
    ports:
      - "4011:4011"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4011/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - parkly-net

  # ── Web Apps ───────────────────────────────────────────────
  host-dashboard:
    build:
      context: ./apps/host-dashboard
      dockerfile: Dockerfile
    container_name: parkly-host-dashboard
    restart: unless-stopped
    ports:
      - "3001:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - parkly-net

  admin-portal:
    build:
      context: ./apps/admin-portal
      dockerfile: Dockerfile
    container_name: parkly-admin-portal
    restart: unless-stopped
    ports:
      - "3002:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - parkly-net

volumes:
  postgres_data:

networks:
  parkly-net:
    driver: bridge
